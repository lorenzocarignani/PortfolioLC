<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Rendimiento: conexión previa a Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- SEO y título rápido -->
    <title>Lorenzo Carignani | Full Stack Developer</title>
    <meta
      name="description"
      content="Portafolio de Lorenzo Carignani, desarrollador Full Stack con experiencia en .NET, React, SQL Server y Azure."
    />

    <!-- Fuentes: swap para que se vea texto sin demorar -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <!-- Icono -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Performance: color de fondo predeterminado para carga -->
    <meta name="theme-color" content="#0f0f0f" />

    <!-- Opcional: si tu foto está en public -->
    <!-- <link rel="preload" href="/foto.webp" as="image" /> -->
  </head>
  <body style="background-color: #0f0f0f; color: white">
    <div id="root"></div>

    <!-- Entrada de la app -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
